name: Version bump

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Belt-and-suspenders loop guard: GitHub already skips re-triggering
      # push-triggered workflows for commits made with the default
      # GITHUB_TOKEN, and the bump commit below also carries "[skip ci]" -
      # either alone would prevent a runaway bump loop, but this makes it
      # explicit and keeps the job a no-op if anything upstream changes.
      - name: Check whether this is already a version-bump commit
        id: guard
        run: |
          MESSAGE="$(git log -1 --pretty=%B)"
          if [[ "$MESSAGE" == "chore: bump version to"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version from the latest commit message
        if: steps.guard.outputs.skip != 'true'
        id: bump
        run: |
          MESSAGE="$(git log -1 --pretty=%B)"
          NEW_VERSION="$(node scripts/bump-version.js --from-commit-message "$MESSAGE")"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag the version bump
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json client/package.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"
